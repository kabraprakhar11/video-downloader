<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    
    <header class="header">
      <img src="icon.svg" alt="Logo" class="logo-img" />
      <div class="brand">
        <h1 class="brand-title">Click2<span class="accent">Video</span></h1>
        <p class="brand-subtitle">Universal Downloader</p>
      </div>
    </header>

    <main class="content">
      <div class="tab-info" id="tab-info">
        <div class="tab-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="tab-text">
          <div class="tab-title" id="current-title">Detecting video...</div>
          <div class="tab-url" id="current-url">...</div>
        </div>
      </div>

      <button id="btn-download-current" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download Current Page
      </button>

      <div class="divider">
        <span>OR PASTE URL</span>
      </div>

      <div class="input-group">
        <input type="text" id="manual-url" placeholder="https://..." autocomplete="off" />
        <button id="btn-download-manual" class="btn btn-secondary">Go</button>
      </div>
    </main>

    <footer class="footer">
      <a href="http://localhost:3000/?upgraded=true" target="_blank" class="footer-link premium">🌟 Get Premium</a>
      <a href="http://localhost:3000" target="_blank" class="footer-link">Dashboard</a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
